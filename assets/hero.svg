<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.58  0 0 0 0 0.52  0 0 0 0 0.42  0 0 0 0.10 0"/>
    </filter>
    <filter id="photoGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.22  0 0 0 0.16 0"/>
    </filter>
    <radialGradient id="vignette" cx="45%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#F6EFE1"/>
      <stop offset="60%" stop-color="#F1E8D8"/>
      <stop offset="100%" stop-color="#E6DAC4"/>
    </radialGradient>
    <radialGradient id="photoBg" cx="38%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#DAD1C2"/>
      <stop offset="55%" stop-color="#C9BFAE"/>
      <stop offset="100%" stop-color="#ABA18F"/>
    </radialGradient>
    <linearGradient id="bustShade" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#EFE8DA"/>
      <stop offset="38%" stop-color="#D9D0C1"/>
      <stop offset="70%" stop-color="#B9AF9E"/>
      <stop offset="100%" stop-color="#948A79"/>
    </linearGradient>
    <linearGradient id="robeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DED5C6"/>
      <stop offset="55%" stop-color="#C3B9A8"/>
      <stop offset="100%" stop-color="#9C927F"/>
    </linearGradient>
    <clipPath id="photoClip">
      <path d="M 700 150 C 820 138 980 142 1090 152 C 1190 160 1270 178 1325 215 C 1365 242 1388 280 1396 330 C 1406 400 1410 470 1404 545 C 1400 610 1392 660 1376 705 C 1358 752 1330 788 1295 818 C 1260 848 1210 872 1145 890 C 1080 908 1000 916 900 918 C 815 920 745 912 700 898 C 662 886 642 862 634 830 C 624 792 620 730 620 660 C 620 590 622 520 630 450 C 638 380 652 318 672 268 C 690 224 706 192 700 150 Z"/>
    </clipPath>
    <clipPath id="cobaltClip">
      <path d="M 1600 0 L 1600 1010 L 0 1010 L 0 0 Z"/>
    </clipPath>
  </defs>

  <!-- Paper base -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>

  <!-- Quiet-field contour echoes (broken lines drifting from bust toward text side) -->
  <g stroke="#4A4034" stroke-width="2.2" fill="none" opacity="0.5" stroke-linecap="round" stroke-dasharray="14 10 4 8">
    <path d="M 660 330 C 560 300 470 330 390 380"/>
    <path d="M 640 470 C 540 450 430 465 350 510"/>
    <path d="M 655 620 C 555 600 465 620 400 660"/>
  </g>
  <g stroke="#7C7262" stroke-width="1.4" fill="none" opacity="0.45" stroke-linecap="round" stroke-dasharray="3 7">
    <path d="M 640 550 C 560 540 480 555 420 585"/>
  </g>

  <!-- Photo anchor: Socrates bust inside torn fragment -->
  <g clip-path="url(#photoClip)">
    <rect x="600" y="120" width="840" height="820" fill="url(#photoBg)"/>
    <!-- soft inner shadow top -->
    <ellipse cx="1010" cy="560" rx="400" ry="380" fill="none" stroke="#8A8071" stroke-width="90" opacity="0.12"/>
    <!-- bust -->
    <g>
      <!-- head + neck outline -->
      <path d="M 1010 205 C 1072 204 1132 262 1157 342 C 1170 388 1174 430 1168 470 C 1162 505 1150 535 1130 560 C 1118 576 1112 592 1115 612 C 1118 634 1128 650 1140 662 L 958 668 C 948 640 942 612 938 582 C 920 540 900 512 884 470 C 874 444 870 422 874 402 C 878 380 884 362 886 344 C 892 310 898 282 912 258 C 930 228 962 208 1010 205 Z" fill="url(#bustShade)"/>
