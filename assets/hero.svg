    <!-- photo grain + halftone -->
    <rect x="600" y="120" width="840" height="820" filter="url(#photoGrain)"/>
    <g fill="#4A4034" opacity="0.10">
      <circle cx="760" cy="300" r="3"/><circle cx="790" cy="330" r="2.4"/><circle cx="724" cy="360" r="2.8"/>
      <circle cx="1320" cy="300" r="3"/><circle cx="1350" cy="350" r="2.4"/><circle cx="1300" cy="390" r="2.6"/>
      <circle cx="1340" cy="520" r="2.8"/><circle cx="1370" cy="570" r="2.2"/><circle cx="1326" cy="620" r="2.6"/>
      <circle cx="740" cy="700" r="2.6"/><circle cx="770" cy="740" r="2.2"/><circle cx="706" cy="770" r="2.8"/>
    </g>
  </g>

  <!-- Torn edge on the right of the photo fragment where illustration emerges -->
  <g fill="none" stroke="#F1E8D8" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M 1386 226 C 1402 240 1414 262 1420 290 C 1428 322 1430 358 1426 396 C 1422 438 1412 470 1400 500 C 1388 532 1376 556 1370 576"/>
    <path d="M 1418 330 C 1436 348 1444 372 1446 400 C 1448 432 1444 462 1434 490"/>
  </g>

  <!-- Cobalt illustration field (upper right), source-derived planes -->
  <path d="M 1600 0 L 1130 0 C 1090 30 1062 66 1060 104 C 1058 142 1078 172 1110 196 C 1150 226 1190 248 1222 280 C 1256 314 1278 354 1282 398 C 1286 446 1270 492 1238 528 C 1206 564 1168 590 1144 622 C 1122 652 1112 684 1120 716 C 1128 750 1156 776 1196 794 C 1236 812 1282 824 1330 840 C 1400 862 1478 884 1600 908 Z" fill="#2749C9"/>
  <path d="M 1600 0 L 1268 0 C 1240 40 1224 84 1232 126 C 1240 168 1268 198 1304 220 C 1340 242 1382 260 1418 288 C 1456 318 1480 356 1486 398 C 1492 442 1478 486 1448 518 C 1420 548 1384 570 1356 596 C 1330 620 1316 648 1320 678 C 1324 710 1346 736 1380 754 C 1420 774 1470 792 1526 810 L 1600 830 Z" fill="#1D38A0" opacity="0.85"/>
  <!-- torn boundary along cobalt left edge -->
  <path d="M 1134 6 C 1096 38 1066 72 1064 106 L 1074 128 L 1062 148 L 1074 170 L 1064 190 L 1082 212 L 1070 232 L 1094 254 L 1084 274 L 1110 296 L 1100 316 L 1130 338 L 1120 358 L 1148 380 L 1138 400 L 1164 422 L 1154 442 L 1178 464 L 1168 484 L 1190 506 L 1180 526 L 1200 548 L 1190 568 L 1208 590 L 1198 610 L 1214 632 L 1204 652 L 1218 674 L 1210 694 L 1222 716 L 1214 736 L 1228 758" stroke="#F1E8D8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- deeper torn notches -->
  <path d="M 1116 154 L 1096 168 L 1106 190" stroke="#F1E8D8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 1186 416 L 1166 432 L 1178 456" stroke="#F1E8D8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 1230 668 L 1212 686 L 1224 708" stroke="#F1E8D8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- torn paper window inside cobalt -->
  <path d="M 1396 120 C 1430 112 1468 116 1498 132 C 1516 141 1524 156 1522 174 C 1519 198 1506 216 1486 226 C 1458 240 1420 240 1394 226 C 1374 215 1364 194 1368 168 C 1372 146 1384 128 1396 120 Z" fill="#F1E8D8"/>
  <path d="M 1480 400 C 1510 392 1542 396 1568 410 C 1584 419 1590 432 1588 448 C 1585 468 1572 484 1554 492 C 1530 502 1498 502 1476 490 C 1458 480 1450 462 1454 440 C 1457 422 1468 406 1480 400 Z" fill="#F1E8D8" opacity="0.9"/>
  <!-- cobalt accent strokes near bust -->
  <g stroke="#2749C9" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 1330 640 C 1368 660 1408 674 1450 684"/>
    <path d="M 1348 700 C 1390 716 1432 728 1476 736"/>
  </g>

  <!-- halftone dot cluster lower right -->
  <g fill="#3A3128" opacity="0.22">
    <circle cx="1460" cy="880" r="5"/><circle cx="1482" cy="896" r="4"/><circle cx="1508" cy="882" r="5.5"/>
    <circle cx="1440" cy="912" r="3.5"/><circle cx="1470" cy="930" r="4.5"/><circle cx="1502" cy="918" r="3.5"/>
    <circle cx="1532" cy="900" r="5"/><circle cx="1558" cy="920" r="3.5"/>
  </g>

  <!-- olive branch line-art, quiet left-bottom -->
  <g stroke="#3A3128" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 120 880 C 150 850 190 830 240 820"/>
    <path d="M 160 855 C 170 840 182 834 196 834"/>
    <path d="M 190 842 C 205 832 218 830 230 836"/>
    <path d="M 130 868 C 142 856 156 852 170 854"/>
  </g>
  <g fill="#2749C9">
    <ellipse cx="204" cy="828" rx="9" ry="11" transform="rotate(-18 204 828)"/>
  </g>
  <g fill="#3A3128" opacity="0.85">
    <ellipse cx="242" cy="816" rx="8" ry="10" transform="rotate(10 242 816)"/>
  </g>

  <!-- micro text fragments -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#4A4034">
    <text x="96" y="96" font-size="26" letter-spacing="10" opacity="0.75">ΣΩΚΡΑΤΗΣ</text>
    <text x="96" y="140" font-size="17" letter-spacing="6" opacity="0.55">苏格拉底 · 提问词</text>
    <text x="420" y="952" font-size="18" letter-spacing="8" opacity="0.4">事实 · 解释 · 应用 · 评价</text>
    <text x="1430" y="80" font-size="15" letter-spacing="4" opacity="0.5">ASK · NOT TELL</text>
  </g>
  <!-- registration marks in cobalt -->
  <g stroke="#2749C9" stroke-width="2" opacity="0.7">
    <path d="M 78 78 h 26 M 91 65 v 26"/>
    <path d="M 1506 78 h 26 M 1519 65 v 26"/>
    <path d="M 78 912 h 26 M 91 899 v 26"/>
  </g>

  <!-- torn paper bottom edge -->
  <path d="M 0 906
    L 34 912 L 68 904 L 104 914 L 140 908 L 178 916 L 214 907 L 252 915 L 288 906 L 326 913 L 362 905 L 400 917 L 438 908 L 476 914 L 514 905 L 552 916 L 590 908 L 628 913 L 664 904 L 700 915 L 738 906 L 776 914 L 812 905 L 850 916 L 888 908 L 926 912 L 962 903 L 1000 915 L 1038 906 L 1076 913 L 1114 905 L 1152 916 L 1190 907 L 1228 914 L 1266 905 L 1304 916 L 1342 908 L 1380 913 L 1416 904 L 1454 915 L 1492 906 L 1530 914 L 1566 905 L 1600 912 L 1600 1000 L 0 1000 Z" fill="#F1E8D8"/>
