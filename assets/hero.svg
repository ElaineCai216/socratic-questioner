      <!-- nostril shadow -->
      <path d="M 872 396 C 878 394 884 392 888 388" stroke="#6E6454" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.8"/>
      <!-- jaw line -->
      <path d="M 884 468 C 894 482 906 494 922 500" stroke="#5C5344" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- mouth line -->
      <path d="M 898 434 C 906 430 912 432 914 438" stroke="#5C5344" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- ear -->
      <path d="M 1148 452 C 1156 462 1158 476 1152 488 C 1146 500 1138 506 1132 508" stroke="#8A8071" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <!-- beard mass -->
      <path d="M 916 470 C 898 500 886 538 902 572 C 920 608 956 628 1000 630 C 1048 632 1092 618 1120 592 C 1130 582 1134 568 1130 552 C 1126 540 1118 534 1110 532 C 1082 526 1052 530 1022 530 C 982 530 948 514 930 490 C 922 480 918 472 916 470 Z" fill="#8E8372"/>
      <path d="M 916 470 C 906 492 898 516 902 544 C 906 574 926 600 956 616 C 970 624 986 628 1002 628" fill="none" stroke="#5C5344" stroke-width="2.5" opacity="0.7"/>
      <path d="M 938 500 C 930 522 932 550 946 574" stroke="#6E6454" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 972 520 C 966 548 970 580 986 606" stroke="#6E6454" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 1012 536 C 1010 566 1016 596 1032 618" stroke="#6E6454" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <!-- neck shadow -->
      <path d="M 1000 640 C 1012 620 1026 614 1042 618" stroke="#6E6454" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
      <!-- robe -->
