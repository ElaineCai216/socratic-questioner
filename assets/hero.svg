      <g stroke="#8A8071" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M 852 730 C 866 772 870 820 858 872"/>
        <path d="M 930 704 C 944 752 946 806 934 866"/>
        <path d="M 1010 684 C 1026 738 1030 800 1020 862"/>
        <path d="M 1096 690 C 1112 744 1116 806 1106 866"/>
        <path d="M 1180 716 C 1196 768 1200 826 1192 876"/>
        <path d="M 1246 748 C 1260 796 1264 848 1256 890"/>
      </g>
      <path d="M 1022 800 C 1042 832 1054 862 1058 896" stroke="#6E6454" stroke-width="2.4" fill="none" opacity="0.55" stroke-linecap="round"/>
      <path d="M 1140 742 C 1156 780 1162 826 1160 878" stroke="#6E6454" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round"/>
      <g stroke="#B3A996" stroke-width="2" fill="none" opacity="0.7">
        <path d="M 892 722 C 904 764 908 812 900 864"/>
        <path d="M 1058 692 C 1072 742 1074 800 1066 858"/>
      </g>
