  <g stroke="#D8CCB6" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
    <path d="M 140 906 l 3 14"/><path d="M 214 906 l -2 12"/><path d="M 400 908 l 2 16"/>
    <path d="M 590 908 l -3 13"/><path d="M 812 904 l 2 15"/><path d="M 1000 906 l -2 14"/>
    <path d="M 1190 906 l 3 12"/><path d="M 1416 904 l -3 15"/><path d="M 1530 905 l 2 13"/>
  </g>
  <g stroke="#BEB29B" stroke-width="1" opacity="0.7" stroke-linecap="round">
    <path d="M 260 907 l 1 9"/><path d="M 664 905 l -1 10"/><path d="M 1152 906 l 1 8"/>
    <path d="M 1342 906 l -1 9"/><path d="M 888 907 l 1 11"/>
  </g>
</svg>
